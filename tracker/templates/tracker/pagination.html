{% if page.has_other_pages %}<nav class="pagination" aria-label="Halaman"><span>Halaman {{ page.number }} dari {{ page.paginator.num_pages }}</span><div>{% if page.has_previous %}<a class="button secondary compact" href="?page={{ page.previous_page_number }}{% if search %}&q={{ search|urlencode }}{% endif %}">← Sebelumnya</a>{% endif %}{% if page.has_next %}<a class="button secondary compact" href="?page={{ page.next_page_number }}{% if search %}&q={{ search|urlencode }}{% endif %}">Berikutnya →</a>{% endif %}</div></nav>{% endif %}
